repo_url: https://github.com/UnB-IHC/IHC_2026.2_Grupo12
repo_name: UnB-IHC/IHC_2026.2_Grupo12

site_url: https://unb-ihc.github.io/IHC_2026.2_Grupo12/
site_name: IHC 2026.2 • Grupo 12

use_directory_urls: False

nav:
  - Contextualização: 'index.md'
  - Temas IHC: 'temas_ihc.md'
  - Ferramentas: 'ferramentas.md'
  - Checklist:
    - Etapa 1 - Escopo e Conformidade: 'checklist/etapa1.md'
    - Etapa 2 - Estrutura e Semântica: 'checklist/etapa2.md'
    - Etapa 3 - Navegação e Teclado: 'checklist/etapa3.md'
    - Etapa 4 - Design e Contraste: 'checklist/etapa4.md'
    - Etapa 5 - Formulários e Tempo: 'checklist/etapa5.md'
    - Etapa 6 - Conteúdo e Multimídia: 'checklist/etapa6.md'
    - Etapa 7 - Heurísticas de Nielsen: 'checklist/etapa7.md'
  - Entrevista: 'entrevista.md'

theme:
  name: material
  language: pt-BR
  logo: imagens/logo-verificaaa.png
  favicon: imagens/logo-verificaaa.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: false
      clickable_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/checklist.js
